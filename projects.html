<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects by Lorenzo Colombo.">
    <meta name="theme-color" content="#070a0f">
    <title>Lorenzo Colombo — Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="stylesheet" href="./content.css">
    <link rel="stylesheet" href="./navbar.css">
    <script src="./fadenavbar.js" defer></script>
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ambient-three" aria-hidden="true"></div>
    <div class="ambient ambient-four" aria-hidden="true"></div>
    <div class="scroll-progress" aria-hidden="true"></div>

    <nav class="navbar" aria-label="Main navigation">
        <a href="./index.html#top">Home</a>
    </nav>

    <main class="projects-page">
        <header class="projects-hero">
            <span class="titlegray">PROJECT ARCHIVE</span>
            <h1 class="titlewhite">MORE PROJECTS</h1>
            <p class="paragraph">A growing collection of projects, experiments, and work built over time.</p>
        </header>

        <section class="project-list" aria-label="Project list">
            <!-- Duplicate a .project-row below when you add another project. -->
            <a class="project-row" href="https://github.com/LoreAidos" target="_blank" rel="noopener noreferrer">
                <div class="project-index">01</div>
                <div class="project-info">
                    <span class="project-list-kicker">2026</span>
                    <h2>Wordle style guesser game</h2>
                    <p>Go · HTML · CSS · JavaScript · GitHub</p>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square project-row-icon" aria-hidden="true"></i>
            </a>
        </section>

        <a class="back-home" href="./index.html#projects">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            Back to featured project
        </a>
    </main>

    <script>
        const progress = document.querySelector('.scroll-progress');
        function updateProgress() {
            const max = document.documentElement.scrollHeight - window.innerHeight;
            progress.style.width = `${max > 0 ? (window.scrollY / max) * 100 : 0}%`;
        }
        window.addEventListener('scroll', updateProgress, { passive: true });
        updateProgress();
    </script>
</body>
</html>
